# Belief Configuration
# One file controls the entire system. Change parameters here and the workflow adapts automatically.

belief_config:

  # ─── MODEL SELECTION ───────────────────────────────────────────────────────
  # Models used at each stage of the pipeline.
  # Setup prompts (00, 01, 03, 06) and the belief engine can use different models.
  # Use a capable reasoning model for belief evolution; a faster model for extraction.
  belief_reasoning_model: claude-opus-4-8        # belief engine (Step 7) and setup compilers (03, 06)
  fact_extraction_model: claude-sonnet-4-6       # fact extractor (Step 6)
  document_profile_model: claude-sonnet-4-6      # interview agent (Step 1, Prompt 00)
  transcription_model: claude-sonnet-4-6         # document intake and transcription (Step 5)

  # ─── TOKEN LIMITS ──────────────────────────────────────────────────────────
  # Documents above this limit are split into chunks for the fact extraction loop.
  # Documents below this limit run as a single extraction pass.
  token_limit_per_chunk: 50000

  # ─── ACTIVE BELIEF STREAMS ──────────────────────────────────────────────────
  # Standard belief streams available for stream setup.
  # Each stream selects one of these at setup time (Step 0).
  # Custom streams can be defined during the Prompt 00 interview.
  standard_streams:
    - factual_understanding       # 00 — Factual Understanding
    - business_model_understanding # 01 — Business Model Understanding
    - business_dynamics           # 02 — Business Dynamics
    - causal_understanding        # 03 — Causal Understanding
    - business_memory             # 04 — Business Memory
    - narrative_understanding     # 05 — Narrative Understanding
    - forecast_and_plan_behavior  # 06 — Forecast and Plan Behavior

  # ─── MATURITY LADDER ───────────────────────────────────────────────────────
  # Documents required to advance through the durability stages.
  # These are defaults; the Strategic Blueprint (Prompt 01) can override per stream
  # based on the document cadence for that entity (e.g., quarterly vs. monthly).
  maturity_thresholds:
    candidate_to_provisional: 2   # documents with supporting signal
    provisional_to_confirmed: 3
    confirmed_to_established: 4

  # Retirement requires SUSTAINED contradiction -- never one anomalous document.
  # A single contradiction produces [TENSION] (held, statement rewritten to name
  # the tension and what would resolve it); only this many consecutive
  # contradicting comparable documents produce [RETIRE].
  retire_after_consecutive_contradictions: 3

  # ─── VERIFICATION GATING (Process Test — rigor follows citation weight) ─────
  # The master test CLASSIFIES, it does not discard: recurring entity-specific
  # regularities that fail it become Observations (see below), not trash.
  # For items that pass it (belief candidates), verification is placed where
  # trust is CONSUMED, not at the front door — the gates sit one rung lower
  # than the earlier design:
  #   Candidate → Provisional : plain recurrence (a hypothesis, cited hedged)
  #   Provisional → Confirmed : a blind pass independently re-derived it
  #                             (first tier citable WITHOUT hedging)
  #   Confirmed → Established  : an active contradiction search, reported clean
  require_blind_pass_for_confirmed: true        # Provisional→Confirmed (was: →Provisional)
  require_contradiction_search_for_established: true  # Confirmed→Established (was: →Confirmed)

  # ─── OBSERVATION TIER ───────────────────────────────────────────────────────
  # Recurring entity-specific regularities that fail the master test (reporting
  # conventions, vocabulary habits, structural patterns) are stored in
  # observations.md as a lightweight two-field tier, cited only as "unverified
  # pattern," never as beliefs. Promotion to a belief happens only when genuine
  # interpretation appears (see belief-doctrine.md "Three Tiers of Memory").
  observation_tier_enabled: true
  max_observations_per_stream: 40

  # ─── MATCH LEDGER ───────────────────────────────────────────────────────────
  # Every evidence-routing decision (signal → which belief, or deliberately not)
  # is logged to match_ledger.md with a one-line basis. Makes routing auditable
  # and staleness detectable. Matching is by underlying mechanical claim, never
  # heading text.
  match_ledger_enabled: true

  # ─── LADDER DECAY (the system's only decay mechanism, document-count-based) ──
  # A belief untouched by relevant signal walks DOWN the ladder, one rung per
  # this many consecutive silent comparable documents (tag: [DECAY]):
  # Established → Confirmed → Provisional. At the Provisional floor it is marked
  # STALE (evidence intact, untested) rather than dropping to Candidate. A STALE
  # belief whose pattern resurfaces re-enters verification. Measured in
  # comparable documents, not days -- a fast-cadence stream and a slow one
  # shouldn't decay on the same wall-clock timer.
  decay_after_silent_documents: 4
  decay_floor: Provisional     # STALE-marked here rather than dropping to Candidate

  # ─── COMPILATION GATE ───────────────────────────────────────────────────────
  # Compiled prompts (belief_reasoning_prompt, fact_extractor_prompt) carry a
  # status: ready | blocked. "blocked" means a gap the compiler NAMED rather
  # than filled — a thin blueprint section, or an UNGROUNDED Structural Map.
  # Naming a gap is not enough: the runtime must refuse to write durable memory
  # from a blocked prompt. A warning label is not a brake.
  block_runtime_on_unready_prompt: true
  # If false, a blocked prompt may run only with explicit per-run user override,
  # and every belief it writes is tagged provisional-pending-recompile.

  # ─── SOURCE AUTHORITY ───────────────────────────────────────────────────────
  # foundation.source_authority names, per question type (final actuals,
  # forecast/plan assumptions, internal narrative, external narrative, metric
  # definitions), which document type is authoritative. This is the one
  # foundation claim NOT discoverable from reading -- documents that happen to
  # agree so far never reveal which one should win once they disagree, so it
  # is captured only from what the user states at setup (optional).
  source_authority_enabled: true

  # A disagreement explained by ranked Source Authority defers to the named
  # winner automatically (not a decision needing confirmation -- the user
  # already made the call at setup). A disagreement between two document
  # types of EQUAL, unranked authority is never silently picked:
  source_authority_tie_resolution: flag   # flag | user_confirm (flag logs [SOURCE_CONFLICT] and moves on; user_confirm pauses for a decision)

  # ─── FOUNDATION CORPUS GROUNDING ────────────────────────────────────────────
  # After this many documents' fact logs exist, Prompt -1 runs its corpus
  # grounding pass: read all fact logs together, extract what recurred
  # identically (definitional claims -> source: corpus), corroborate or
  # challenge interview claims. Interview-only claims remain labeled
  # hypotheses until corroborated.
  foundation_grounding_min_documents: 3

  # ─── STRUCTURAL DRIFT CHECK (ingestion Step 6.5) ───────────────────────────
  # Every fact log opens with a STRUCTURE OBSERVED block, compared against the
  # Document Profile's Structural Map. Drift resolves as Recalibrate (template
  # changed -> map revised + extractor recompiled), Signal (communication
  # choice -> feeds the belief engine), or Defer (watch next document).
  # Deferred drift recurring across this many consecutive comparable documents
  # forces a Recalibrate-or-Signal decision:
  structural_drift_escalation_documents: 2

  # Who resolves Recalibrate vs Signal. The two readings lead in opposite
  # directions (update the machinery vs feed the beliefs), so default is
  # user_confirm; "automatic" lets the engine resolve only unambiguous cases
  # (e.g., pure renames with identical content position).
  structural_drift_resolution: user_confirm     # user_confirm | automatic

  # ─── FOUNDATION REVIEW ──────────────────────────────────────────────────────
  # Two independent trigger paths, either sufficient on its own
  # (lifecycle/ingestion-pipeline.md, Step 7.5):
  #   Path 1 — a belief reaches this status while bearing on a named foundation
  #            claim. A Candidate or Provisional belief never triggers path 1.
  #   Path 2 — a document's fact log carries a REDEFINITION SIGNAL (see
  #            06-fact-extractor.md). Fires immediately, independent of any
  #            belief's maturity — the document itself stated the definition
  #            changed, so there is no evidence to accumulate first.
  foundation_review_trigger_status: Confirmed   # Confirmed or Established (path 1 only)
  redefinition_signal_triggers_review: true     # path 2 — set false only to disable entirely

  # How the Adopt/Hold/Defer decision gets made. "user_confirm" surfaces the
  # conflict and waits for the analyst; "automatic" lets the engine Adopt
  # without confirmation whenever the triggering belief is Established (path 1)
  # or whenever a Redefinition Signal fires (path 2).
  # Default is user_confirm — silent foundation edits are the failure mode
  # Grounded exists to prevent.
  foundation_review_resolution: user_confirm    # user_confirm | automatic

  # ─── BELIEF MEMORY BOUNDS ────────────────────────────────────────────────────
  # Maximum number of active beliefs per stream. There is no numeric confidence
  # score to rank by -- when this is exceeded, beliefs are ranked by Status
  # ascending (Candidate/STALE before Provisional before Confirmed before
  # Established), then by Last checked (longest-silent first) within the same
  # Status, and the weakest, stalest are retired first.
  max_beliefs_per_stream: 20

  # Minimum active beliefs before the engine flags over-collapse and audits for umbrella beliefs.
  min_beliefs_volume_check: 8

  # Target range for the first document — number of specific Candidate beliefs to initialize.
  first_doc_target_min: 8
  first_doc_target_max: 15

  # ─── STORAGE PATHS ─────────────────────────────────────────────────────────
  # entities/ holds foundation.md for each entity — built once before any belief stream.
  # compiled/ holds one-time setup artifacts per stream (blueprint, compiled prompts).
  # streams/ holds the living belief memory, fact logs, and raw archive per stream.
  entities_path: ./entities/             # entities/{entity_id}/foundation.md
  compiled_path: ./compiled/             # compiled/{stream_id}/
  streams_path: ./streams/              # streams/{stream_id}/belief.md, belief_versions/, L2_factlogs/, L3_raw/

  # ─── VERSION HISTORY ────────────────────────────────────────────────────────
  # After every document pass, belief.md is snapshotted to
  # belief_versions/{doc_id}_belief.md. The changelog records diffs; snapshots
  # preserve states -- the belief memory after any document stays readable
  # forever, which is what makes a wrong belief diagnosable rather than gone.
  keep_belief_snapshots: true
