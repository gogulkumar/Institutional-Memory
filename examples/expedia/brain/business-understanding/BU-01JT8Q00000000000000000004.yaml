definition: Marketing leverage is management's term for marketing spending growing more slowly than revenue.
interpretation: Leverage gained from a one-off cost step will be lapped a year later, so later leverage
  has to come from elsewhere.
positive_signal: Leverage continues after the prior-year step has been lapped.
negative_signal: The efficiency story changes term once the easy comparison is gone.
agent_reuse: Load when margin expansion is discussed or guided.
boundaries: Management's definition; it is not reconciled to reported marketing expense here.
