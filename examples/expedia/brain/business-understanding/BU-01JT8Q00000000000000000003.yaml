definition: Call architecture is the order and sectioning of the prepared remarks, which shows what management
  treats as the organizing idea.
interpretation: Whatever gets its own section is the thesis; whatever appears only as attribution has
  been demoted.
positive_signal: The same structure repeats across quarters.
negative_signal: A topic moves from a sub-point to its own section, or a frame is mentioned once and dropped.
agent_reuse: Load at the start of every call reading, before the content.
boundaries: Applies to prepared remarks, not the question-and-answer session.
