definition: A minimizing qualifier is a word that gives the direction of a result without its size, such
  as modestly, slightly or slipped.
interpretation: When a unit is the subject, a qualifier with no figure usually marks a result management
  prefers not to size.
positive_signal: The same unit is later described with a figure or a comparison to the market.
negative_signal: The qualifier recurs across quarters while peers are discussed with figures.
agent_reuse: Load when a business unit's result is described without a number.
boundaries: Language evidence only; it does not show the unit's actual performance.
