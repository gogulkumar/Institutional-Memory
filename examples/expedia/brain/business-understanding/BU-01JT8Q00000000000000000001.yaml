definition: 'Since the CEO''s first full quarter, management has described strategy as three priorities:
  traveler value, investing where growth is greatest, and operating efficiency with margin expansion.'
interpretation: The priorities are a narrative frame; they have no stated metrics except margin expansion,
  so any result can be attributed to them.
positive_signal: A priority is tied to a stated measure and that measure is reported against the prior
  target.
negative_signal: A priority is named only after the fact to explain a result.
agent_reuse: Load when reading prepared remarks or when management attributes a result to strategy.
boundaries: Describes how the story is framed, not whether the strategy is working.
