  - RP-01JT8Q00000000000000000001
  completion_rule: Every open Story Thread and watch condition has been checked against the new call,
    and each material change has a supported finding or an explicit gap.
  output_shape: 'One-page brief: lead change, supporting findings, open threads, questions for next call.'
